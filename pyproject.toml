[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meerax"
dynamic = ["version"]
description = "Shared ML utilities — LLM providers, evaluation metrics, visualization, and report generation for Sameer Maurya's projects and organization."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sameer Maurya" }]
keywords = ["machine-learning", "llm", "evaluation", "visualization"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[project.urls]
Homepage = "https://github.com/mauryasameer/the-forge"
Repository = "https://github.com/mauryasameer/the-forge"
Issues = "https://github.com/mauryasameer/the-forge/issues"
Changelog = "https://github.com/mauryasameer/the-forge/blob/main/CHANGELOG.md"

[project.scripts]
meerax = "meerax.cli:main"

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.55", "ollama>=0.3"]
stats = ["statsmodels>=0.14"]
nlp = ["nltk>=3.9"]
imbalance = ["imbalanced-learn>=0.12"]
vision = ["torch>=2.2", "torchvision>=0.17", "pillow>=10.2"]
parquet = ["pyarrow>=15"]
all = [
    "meerax[llm]",
    "meerax[stats]",
    "meerax[nlp]",
    "meerax[imbalance]",
    "meerax[vision]",
    "meerax[parquet]",
]
dev = ["pytest>=8", "pytest-mock>=3.12", "pytest-cov>=5", "ruff==0.16.4", "mypy>=1.10"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["."]
include = ["meerax*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "PIE", "PLC"]
ignore = ["E501", "B008", "PIE790"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["PLC0415", "T201"]
"tests/*"      = ["S101", "PLC0415"]
"conftest.py"  = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["meerax"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
