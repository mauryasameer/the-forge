name: Checks

on:
  workflow_call:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.11.13
      - run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install numpy pandas matplotlib scikit-learn statsmodels nltk imbalanced-learn pillow anthropic openai ollama
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "mypy>=1.10" pandas-stubs
      - run: mypy meerax

  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install numpy pandas matplotlib scikit-learn statsmodels nltk imbalanced-learn pytest pytest-mock pytest-cov pillow anthropic openai ollama
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps
      - name: Download NLTK data
        run: python -c "import nltk; nltk.download('punkt', quiet=True)"
      - name: Run unit tests
        run: pytest tests/unit/ --cov=meerax --cov-report=term-missing -v --tb=short
      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
