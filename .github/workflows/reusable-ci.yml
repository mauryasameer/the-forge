name: Reusable CI

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      ruff-version:
        type: string
        default: "0.11.13"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest==8.* pytest-cov
      - run: pytest tests/unit/ --cov=src --cov-report=term-missing -v --tb=short
      - name: Run integration tests (if any exist)
        run: |
          if find tests/integration -name 'test_*.py' -o -name '*_test.py' 2>/dev/null | grep -q .; then
            pytest tests/integration/ -v --tb=short
          else
            echo "no integration tests yet in tests/integration/, skipping"
          fi
      - run: meerax doctor

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: pip install ruff==${{ inputs.ruff-version }}
      - run: ruff check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config
          else
            echo "no docker-compose.yml in this repo, skipping"
          fi
